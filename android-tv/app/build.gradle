plugins { id 'com.android.application' }

def gmmDefaultUrl = System.getenv('GMM_TV_DEFAULT_URL') ?: ''
def gmmDefaultKey = System.getenv('GMM_TV_DEFAULT_KEY') ?: ''
def gmmTmdbKey = System.getenv('GMM_TV_TMDB_KEY') ?: ''

android {
    namespace 'com.givemymovies.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.givemymovies.tv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + gmmDefaultUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'DEFAULT_SERVER_KEY', '"' + gmmDefaultKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'TMDB_API_KEY', '"' + gmmTmdbKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds false }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
